name: Lint, Security, and Integration Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CURRENT_VERSION: 2.2.0

jobs:
  lint-workflows:
    name: Lint GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflows
        uses: jdx/jactionlint@1027f0a131ab98bc7e191d995bfa15dbed5bbf8f # v2.2.0
        with:
          strict-exit: "true"

  shellcheck:
    timeout-minutes: 10
    name: Lint Shell Scripts with ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0

  hadolint:
    timeout-minutes: 10
    name: Lint Dockerfiles with Hadolint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ env.CURRENT_VERSION }}/Dockerfile
          failure-threshold: warning
          ignore: DL3018,DL3003

  checkov:
    timeout-minutes: 10
    name: Run Checkov for Dockerfile Security Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: ${{ env.CURRENT_VERSION }}/
          quiet: false
          # CKV_DOCKER_7: produces false positives due to the use of ARG for the base image.
          skip_check: CKV_DOCKER_7

  image-smoke:
    name: Test image startup and health
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run image smoke test
        run: tests/image-smoke.sh "$CURRENT_VERSION"

  mysql-no-tls:
    name: Test MySQL queue without TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run integration test
        run: tests/mysql-no-tls.sh "$CURRENT_VERSION"

  redis-replay:
    name: Test Redis queue replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Redis replay test
        run: tests/redis-replay.sh "$CURRENT_VERSION"
