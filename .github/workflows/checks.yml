name: Lint, Security, and Integration Checks

on:
  pull_request:
  push:
    branches:
    - main

permissions: read-all

env:
  CURRENT_VERSION: 2.2.0

jobs:
  shellcheck:
    name: Lint Shell Scripts with ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0

  hadolint:
    name: Lint Dockerfiles with Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ env.CURRENT_VERSION }}/Dockerfile
          failure-threshold: warning
          ignore: DL3018,DL3003

  checkov:
    name: Run Checkov for Dockerfile Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: ${{ env.CURRENT_VERSION }}/
          quiet: false
          # CKV_DOCKER_7: produces false positives due to the use of ARG for the base image.
          skip_check: CKV_DOCKER_7

  image-smoke:
    name: Test image startup and health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run image smoke test
        run: tests/image-smoke.sh "$CURRENT_VERSION"

  mysql-no-tls:
    name: Test MySQL queue without TLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run integration test
        run: tests/mysql-no-tls.sh "$CURRENT_VERSION"

  redis-replay:
    name: Test Redis queue replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Redis replay test
        run: tests/redis-replay.sh "$CURRENT_VERSION"
