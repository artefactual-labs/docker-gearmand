name: Lint, Security, and Integration Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CURRENT_VERSION: 2.2.0

jobs:
  verify-actions-lock:
    name: Verify action lockfile
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0
      - name: Verify locked dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  lint-workflows:
    name: Lint GitHub Actions
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check workflows
        uses: jdx/jactionlint@v2.2.0
        with:
          strict-exit: "true"

  shellcheck:
    timeout-minutes: 10
    name: Lint Shell Scripts with ShellCheck
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0

  hadolint:
    timeout-minutes: 10
    name: Lint Dockerfiles with Hadolint
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ env.CURRENT_VERSION }}/Dockerfile
          failure-threshold: warning
          ignore: DL3018,DL3003

  checkov:
    timeout-minutes: 10
    name: Run Checkov for Dockerfile Security Analysis
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: ${{ env.CURRENT_VERSION }}/
          quiet: false
          # CKV_DOCKER_7: produces false positives due to the use of ARG for the base image.
          skip_check: CKV_DOCKER_7

  image-smoke:
    name: Test image startup and health
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run image smoke test
        run: tests/image-smoke.sh "$CURRENT_VERSION"

  mysql-no-tls:
    name: Test MySQL queue without TLS
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run integration test
        run: tests/mysql-no-tls.sh "$CURRENT_VERSION"

  redis-replay:
    name: Test Redis queue replay
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Redis replay test
        run: tests/redis-replay.sh "$CURRENT_VERSION"
