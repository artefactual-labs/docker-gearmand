name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image release (e.g. 1.1.22.1 or 2.2.0-r1)'
        required: true
        type: string
      latest:
        description: 'Mark as latest in Docker Hub, GitHub, and Dependency-Track'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  REGISTRY_IMAGE: artefactual/gearmand
  DOCKERHUB_USERNAME: artefactual
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  build:
    name: Build platform image
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # Obtain a short-lived signing identity.
      attestations: write # Publish signed provenance and SBOM statements.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check version and build context
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # Keep dotted revisions for 1.x; use `-rN` revisions for 2.x onwards.
          if [[ "$VERSION" =~ ^1\.[[:digit:]]+\.[[:digit:]]+(\.[[:digit:]]+)?$ ]]; then
            :
          elif [[ "$VERSION" =~ ^([2-9]|[1-9][[:digit:]]+)\.[[:digit:]]+\.[[:digit:]]+(-r[1-9][[:digit:]]*)?$ ]]; then
            :
          else
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          if [[ ! -f "$VERSION/Dockerfile" ]]; then
            echo "Build context not found: $VERSION/Dockerfile"
            exit 1
          fi
          echo "Version format OK: $VERSION"

      - name: Derive platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ github.event.inputs.version }}
          file: ${{ github.event.inputs.version }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          provenance: mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Generate runtime SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/sboms"
          docker run --rm "$TRIVY_IMAGE" image \
            --image-src remote --platform "$PLATFORM" \
            --format cyclonedx --no-progress \
            "${REGISTRY_IMAGE}@${DIGEST}" \
            > "$RUNNER_TEMP/sboms/sbom-${PLATFORM_PAIR}.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            "$RUNNER_TEMP/sboms/sbom-${PLATFORM_PAIR}.cdx.json" > /dev/null

      - name: Upload runtime SBOM
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/sboms/*.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Scan runtime vulnerabilities
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy" "$RUNNER_TEMP/vulnerabilities"
          docker run --rm \
            --volume "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --image-src remote --platform "$PLATFORM" \
            --scanners vuln --format json --ignorefile '' --no-progress \
            "${REGISTRY_IMAGE}@${DIGEST}" \
            > "$RUNNER_TEMP/vulnerabilities/vulnerabilities-${PLATFORM_PAIR}.json"

      - name: Upload full vulnerability report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vulnerabilities-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/vulnerabilities/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Block fixable high and critical vulnerabilities
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Reuse the database downloaded by the full scan for the same verdict.
          docker run --rm \
            --volume "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.trivyignore.yaml,dst=/trivyignore.yaml,readonly" \
            "$TRIVY_IMAGE" image \
            --image-src remote --platform "$PLATFORM" \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /trivyignore.yaml --skip-db-update --no-progress \
            --exit-code 1 "${REGISTRY_IMAGE}@${DIGEST}"

      - name: Resolve platform manifest
        id: platform-manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # The build output is an index containing the image and BuildKit provenance.
          digest="$(docker buildx imagetools inspect --raw "${REGISTRY_IMAGE}@${DIGEST}" |
            jq -er --arg arch "${PLATFORM#linux/}" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | if length == 1 then .[0].digest else error("Expected one platform manifest") end
              | select(test("^sha256:[0-9a-f]{64}$"))')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest platform provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: docker.io/${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.platform-manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest runtime SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-name: docker.io/${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.platform-manifest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sboms/sbom-${{ env.PLATFORM_PAIR }}.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify platform attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.platform-manifest.outputs.digest }}
        run: |
          for predicate in https://slsa.dev/provenance/v1 https://cyclonedx.org/bom; do
            gh attestation verify "oci://docker.io/${REGISTRY_IMAGE}@${DIGEST}" \
              --bundle-from-oci --repo "$GITHUB_REPOSITORY" \
              --cert-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners --predicate-type "$predicate"
          done

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-platform image
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # Sign the combined image with the workflow identity.
      attestations: write # Publish the combined image's provenance.
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            ${{ github.event.inputs.version }}-alpine
            ${{ github.event.inputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Push candidate manifest list
        id: candidate
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          for digest in *; do
            args+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --metadata-file "$RUNNER_TEMP/manifest.json" "${args[@]}"
          digest="$(jq -er '."containerimage.descriptor".digest |
            select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/manifest.json")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest multi-platform provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: docker.io/${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify multi-platform provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          gh attestation verify "oci://docker.io/${REGISTRY_IMAGE}@${DIGEST}" \
            --bundle-from-oci --repo "$GITHUB_REPOSITORY" \
            --cert-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners --predicate-type https://slsa.dev/provenance/v1

      - name: Publish verified release tags
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          docker buildx imagetools create "${args[@]}" \
            --metadata-file "$RUNNER_TEMP/published.json" "${REGISTRY_IMAGE}@${DIGEST}"
          test "$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/published.json")" = "$DIGEST"

      - name: Inspect image
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}-alpine"

  release:
    name: Publish release
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    needs: merge
    permissions:
      contents: write # Create the release and its tag.
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download runtime SBOMs
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/sboms
          pattern: sbom-*
          merge-multiple: true

      - name: Create release and tag with gh
        run: gh release create "$VERSION" "$RUNNER_TEMP"/sboms/*.cdx.json --title "$VERSION" --target "$GITHUB_SHA" --latest="$MARK_LATEST"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          MARK_LATEST: ${{ inputs.latest && 'true' || 'false' }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_IMAGE }}

  dependency-track:
    name: Upload runtime inventory to Dependency-Track
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    needs: release
    strategy:
      fail-fast: false
      matrix:
        platform-pair: [linux-amd64, linux-arm64]
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download runtime SBOM
        uses: actions/download-artifact@v8.0.2
        with:
          name: sbom-${{ matrix.platform-pair }}
          path: ${{ runner.temp }}/sboms

      - name: Upload SBOM
        env:
          DEPENDENCY_TRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          DEPENDENCY_TRACK_PARENT_UUID: 4a9bfbde-fa21-4428-b3c5-2bf94971ab2c
          DEPENDENCY_TRACK_IS_LATEST: ${{ inputs.latest && 'true' || 'false' }}
          PROJECT_NAME: ${{ github.repository }}-${{ matrix.platform-pair }}
          VERSION: ${{ github.event.inputs.version }}
          PLATFORM_PAIR: ${{ matrix.platform-pair }}
        run: |
          scripts/upload-sbom.sh \
            "$RUNNER_TEMP/sboms/sbom-${PLATFORM_PAIR}.cdx.json" \
            "$PROJECT_NAME" "$VERSION"
